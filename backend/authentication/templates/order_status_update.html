<div style="background-color: #FDFBF9; padding: 50px 20px; font-family: 'Georgia', serif; color: #324339;">
    <div style="max-width: 600px; margin: 0 auto; background: white; border-radius: 30px; padding: 40px; border: 1px solid #32433910; text-align: center;">
        <h2 style="color: #A86447; font-style: italic; font-weight: normal;">Novedades en tu envío</h2>
        
        <p style="font-size: 14px; text-align: left;">Hola <strong>{{ order.user.full_name }}</strong>,</p>
        <p style="font-size: 14px; color: #32433990; text-align: left;">Tu pedido <strong>#{{ order.tracking_code }}</strong> ha cambiado de estado:</p>

        <div style="display: inline-block; margin: 30px 0; padding: 20px 40px; border: 2px solid #324339; border-radius: 50px;">
            <span style="font-size: 18px; text-transform: uppercase; font-weight: bold; letter-spacing: 2px;">{{ status_display }}</span>
        </div>

        <p style="font-size: 13px; color: #32433960; line-height: 1.6;">
            Puedes ver todos los detalles y el historial de tu pedido accediendo a tu perfil en nuestra tienda online.
        </p>

        <a href="http://localhost:5173/orders" style="display: inline-block; margin-top: 20px; padding: 12px 25px; border: 1px solid #324339; color: #324339; text-decoration: none; border-radius: 50px; font-size: 10px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase;">
            Ver mis pedidos
        </a>
    </div>
</div>
